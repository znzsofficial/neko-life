name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
        sdk: ['minimum', 'latest']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workspace/neko-life
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workspace/neko-life
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: znzsofficial/neko-web
          ref: 3721065b6857b68ce58cc31aaae910ee075e42ab
          path: workspace/neko-web
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: znzsofficial/neko-proactive-mai
          ref: ea79a286b5009092381b9fe6188abc431b5e5a1e
          path: workspace/neko-proactive-mai
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: znzsofficial/neko-draw
          ref: f76e7774e4b3a51fda75816f74adcb4f99ead959
          path: workspace/neko-draw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: znzsofficial/neko-tts
          ref: 15a5c06360a07f826cc7d1e38e772337948f326c
          path: workspace/neko-tts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - if: matrix.sdk == 'minimum'
        run: python -m pip install "maibot-plugin-sdk==2.12.0"
      - if: matrix.sdk == 'latest'
        run: python -m pip install --upgrade "maibot-plugin-sdk>=2.12,<3"
      - run: python -c "import importlib.metadata, maibot_sdk; print('Real SDK', importlib.metadata.version('maibot-plugin-sdk'), maibot_sdk.__file__)"
      - run: python scripts/test_suite.py
      - run: python -m unittest discover -q
        working-directory: workspace/neko-draw
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neko-life-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.sdk }}
          path: |
            workspace/neko-life/dist/*.zip
            workspace/neko-life/dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
