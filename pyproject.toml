[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neko-life-maibot"
version = "0.4.2"
description = "Bounded public exploration and fictional life context for MaiBot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk>=2.12,<3", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "aiohttp>=3.12", "Pillow>=12.0", "ruff==0.15.11"]

[project.urls]
Repository = "https://github.com/znzsofficial/neko-life"
Issues = "https://github.com/znzsofficial/neko-life/issues"

[tool.setuptools.packages.find]
include = ["neko_life*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
