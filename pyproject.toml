[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neko-life-maibot"
version = "0.1.0"
description = "Bounded public exploration and fictional life context for MaiBot"
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk>=2.12,<3"]

[tool.setuptools.packages.find]
include = ["neko_life*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
